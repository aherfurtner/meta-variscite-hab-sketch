# -------------------------------------===== The chip family name [Required] =====--------------------------------------
family: mimx9596
# -----------------------------------------===== MCU revision [Optional] =====------------------------------------------
revision: latest
# -----------------------------------===== Super Root Key (SRK) set [Required] =====------------------------------------
srk_set: oem
# ------------------------------------===== Used SRK [Conditionally required] =====-------------------------------------
used_srk_id: 0
# -------------------------------------===== AHAB container signer [Optional] =====-------------------------------------
signer: SRK1_sha384_secp384r1_v3_usr_key.pem
## ---------------------===== AHAB container signer for second signature (PQC only) [Optional] =====---------------------
signer_#2: SRK1_sha3_512_mldsa87_v3_usr_key.pem
# ------------------------------------===== SRK Table [Conditionally required] =====------------------------------------
srk_table:
  # -------------------------------------------===== CA Flag [Optional] =====-------------------------------------------
  flag_ca: false
  # ---------------------------------------===== Hash Algorithm [Optional] =====----------------------------------------
  hash_algorithm: sha384
  # ---------------------------------===== Super Root Key (SRK) table [Required] =====----------------------------------
  srk_array:
    - SRK1_sha384_secp384r1_v3_usr_crt.pem
    - SRK2_sha384_secp384r1_v3_usr_crt.pem
    - SRK3_sha384_secp384r1_v3_usr_crt.pem
    - SRK4_sha384_secp384r1_v3_usr_crt.pem
  srk_table_#2:
    flag_ca: false
    hash_algorithm: sha3_512
    srk_array:
      - SRK1_sha3_512_mldsa87_v3_usr_crt.pem
      - SRK2_sha3_512_mldsa87_v3_usr_crt.pem
      - SRK3_sha3_512_mldsa87_v3_usr_crt.pem
      - SRK4_sha3_512_mldsa87_v3_usr_crt.pem
