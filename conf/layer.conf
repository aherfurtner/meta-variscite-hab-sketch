# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "variscite-hab"
BBFILE_PATTERN_variscite-hab := "^${LAYERDIR}/"
BBFILE_PRIORITY_variscite-hab = "10"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS:append:ahab = " kernel-image-signed"

LAYERSERIES_COMPAT_variscite-hab = " \
    wrynose \
"

# Temporary for the SPSDK 3.13 proof of concept; revisit with a newer Yocto baseline.
PREFERRED_VERSION_python3-cryptography-native = "49.0.0"
